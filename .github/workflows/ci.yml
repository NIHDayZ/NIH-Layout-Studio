name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Widget geometry diagnostic tests
        run: node --test tests/widget-geometry-diagnostic.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: BC7 decoder regression tests
        run: npm run test:bc7

      - name: Independent BC7 pixel reference
        run: npm run test:bc7:reference

      - name: Workbench widget ID compatibility tests
        run: npm run test:layout-ids

      - name: Native imageset atlas regression tests
        run: npm run test:imageset

      - name: Native-derived grid layout regression tests
        run: npm run test:grid-layout

      - name: Unified layout geometry primitives
        run: npm run test:geometry-engine

      - name: Workbench widget census regression tests
        run: npm run test:widget-census

      - name: SDF preview raster tests
        run: npm run test:sdf-preview

      - name: Packed FNT5 chunk tests
        run: node --test tests/fnt5-packed-chunks.test.mjs

      - name: FNT5 full-string layout comparison tests
        run: node --test tests/fnt5-layout-comparison.test.mjs

      - name: FNT5 unclipped glyph preview tests
        run: node --test tests/fnt5-unclipped-preview.test.mjs

      - name: FNT5 experimental placement tests
        run: node --test tests/fnt5-placement.test.mjs

      - name: FNT5 workspace sibling path tests
        run: node --test tests/fnt5-sibling-paths.test.mjs

      - name: Sidecar-less FNT5 resource tests
        run: node --test tests/fnt5-standalone.test.mjs

      - name: FNT5 TCRD atlas origin tests
        run: node --test tests/fnt5-atlas-origins.test.mjs

      - name: Opt-in MSDF renderer math tests
        run: node --test tests/sdf-msdf-render.test.mjs

      - name: FNT5 MSDF median preview tests
        run: node --test tests/fnt5-msdf-preview.test.mjs

      - name: FNT5 channel contact sheet tests
        run: node --test tests/fnt5-channel-sheet.test.mjs

      - name: FNT5 atlas CLI path tests
        run: node --test tests/fnt5-atlas-cli-path.test.mjs

      - name: FNT5 atlas pixel validation tests
        run: node --test tests/fnt5-atlas-pixels.test.mjs

      - name: FNT5 glyph geometry preview tests
        run: node --test tests/fnt5-glyph-geometry-preview.test.mjs

      - name: FNT5 metric correlation tests
        run: node --test tests/fnt5-tcrd-metric-correlation.test.mjs

      - name: GLPS range-mapping tests
        run: node --test tests/fnt5-glps-range-mapping.test.mjs

      - name: GLPS entry hypothesis tests
        run: node --test tests/fnt5-glps-entries.test.mjs

      - name: GLPS structure tests
        run: node --test tests/fnt5-glps-structure.test.mjs

      - name: FNT5 mapping probe tests
        run: node --test tests/fnt5-mapping-probe.test.mjs

      - name: FNT5 record analysis tests
        run: node --test tests/fnt5-record-analysis.test.mjs

      - name: FNT5 binary diagnostic tests
        run: node --test tests/fnt5-binary-diagnostic.test.mjs

      - name: FNT5 metadata tests
        run: npm run test:fnt5

      - name: Production build
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: nih-layout-studio-dist
          path: dist/
          if-no-files-found: error
